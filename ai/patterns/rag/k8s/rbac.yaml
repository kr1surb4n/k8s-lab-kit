apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: rag-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-api
  namespace: k8s-lab
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-api
  namespace: k8s-lab
subjects:
  - kind: ServiceAccount
    name: rag-api
    namespace: k8s-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rag-api