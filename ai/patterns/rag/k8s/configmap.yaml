apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: rag-api
data:
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  RERANKER_MODEL: "BAAI/bge-reranker-base"
  GENERATOR_MODEL: "mistralai/Mistral-7B-Instruct-v0.3"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"
  TOP_K: "50"
  RERANK_TOP_K: "5"
  RRF_K: "60"
  HYBRID_ALPHA: "0.5"
  TEMPERATURE: "0.3"
  TOP_P: "0.9"
  REPETITION_PENALTY: "1.1"
  MAX_TOKENS: "512"
  GUARDRAIL_ENABLED: "true"
  LOG_LEVEL: "INFO"