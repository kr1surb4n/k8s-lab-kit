apiVersion: v1
kind: Secret
metadata:
  name: graph-rag-secrets
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: graph-rag-api
type: Opaque
stringData:
  # Database connection (PGVector + AGE) - for the mockup, this is unused
  PGVECTOR_DSN: "postgresql://graph_rag:changeme@postgres-age.k8s-lab:5432/graph_rag"
  # Model storage (if using private registry)
  HF_TOKEN: "changeme"
  # JWT signing key for auth - required by the mockup if auth is enabled
  JWT_SECRET: "changeme-generate-with-openssl-rand-base64-32"