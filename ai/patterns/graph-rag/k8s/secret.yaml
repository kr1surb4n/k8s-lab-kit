apiVersion: v1
kind: Secret
metadata:
  name: graph-rag-secrets
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: graph-rag-api
type: Opaque
stringData:
  # Database connection (PGVector + AGE)
  PGVECTOR_DSN: "postgresql://graph_rag:changeme@postgres-age.k8s-lab:5432/graph_rag"
  # Model storage (if using private registry)
  HF_TOKEN: "changeme"
  # JWT signing key for auth
  JWT_SECRET: "changeme-generate-with-openssl-rand-base64-32"
  # OTel endpoint
  OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability:4318/v1/traces"