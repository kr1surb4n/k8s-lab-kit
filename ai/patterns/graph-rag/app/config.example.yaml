# Example Graph RAG configuration.
#
# Copy this file to ~/.config/graphrag/config.yaml and edit the paths.
# That private file holds personal paths and database passwords, so it must
# stay outside the repository and be readable only by your user:
#
#   mkdir -p ~/.config/graphrag
#   cp app/config.example.yaml ~/.config/graphrag/config.yaml
#   chmod 600 ~/.config/graphrag/config.yaml
#
# Nothing in this example points at real private data.

ollama_url: http://localhost:11434

models:
  embed: bge-m3-local
  generate: granite3.3-8b-local
  fallback: qwen3-8b-local

# The eval database holds only the synthetic lab corpus. The private database
# holds notes and papers. Keep them on different ports and volumes.
databases:
  eval: postgresql://graphrag:graphrag-dev-only@localhost:5433/graphrag
  private: postgresql://graphrag:graphrag-private-dev-only@localhost:5434/graphrag_private

# Chunking and retrieval defaults.
chunk_words: 320
chunk_overlap: 50
vector_top_k: 30
lexical_top_k: 30
answer_top_k: 12
# One hop is the default; 2 follows shared entities into other documents.
graph_hops: 1

# Rerank the fused candidates with one local listwise LLM call.
# This adds latency; leave it off unless the evaluation improves.
rerank: false
rerank_candidates: 20
rerank_model: ""   # empty = use models.generate

# Fail loudly on relation questions when the graph layer has no context.
require_graph: false

# Optional OpenTelemetry spans. Attributes contain counts and settings only;
# question and passage text are never added to a span.
otel:
  enabled: false
  endpoint: http://localhost:4318/v1/traces
  service_name: graphrag-local
  console: false

# Document sources. Corpus names are fixed: notes and papers.
sources:
  notes:
    kind: files
    path: ~/Documents
    include:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.html"
      - "**/*.pdf"
      - "**/*.docx"
    exclude:
      - "My Games/**"
      - "NVIDIA Nsight Compute/**"
      - "zip/**"
      - "**/__pycache__/**"
      - "**/.git/**"
    # 30 MB accommodates large single-file web pages; lower it for a stricter default.
    max_file_bytes: 30000000
    min_words: 15
    # OCR only low-text PDF pages. Needs the tesseract CLI, not a Python package.
    ocr: false
    ocr_lang: eng
    ocr_min_words: 10
    ocr_dpi: 200

  papers:
    kind: papers
    path: ~/papers
    pdf_dir: processed-pdfs
    summaries_dir: analysis_results_per_file
    include: []
    exclude: []
    ocr: false
    ocr_lang: eng
    ocr_min_words: 10
    ocr_dpi: 200
