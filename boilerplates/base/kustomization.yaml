# Base boilerplate — common deployment + service + probes + resources.
#
# Overlay this in a scenario folder:
#   resources:
#     - ../../boilerplates/base
#   patches:
#     - patch: |-
#         - op: replace
#           path: /spec/template/spec/containers/0/image
#           value: my-app:v1.2.3
#       target:
#         kind: Deployment
#   namespace: my-ns
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: base-app

namespace: default

# The labels/namespace above are defaults; overlay replaces them via patches or
# `kustomize edit set namespace` / `kustomize edit add label`.