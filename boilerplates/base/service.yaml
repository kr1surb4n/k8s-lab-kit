# Base Service — ClusterIP exposing the deployment on port 80.
#
# Override type to LoadBalancer/NodePort in overlay if needed.
# Default values (overridden by overlay): name=base-app, port=80
apiVersion: v1
kind: Service
metadata:
  name: base-app
  labels:
    app.kubernetes.io/name: base-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: base-app
  ports:
    - name: http
      port: 80
      targetPort: 80