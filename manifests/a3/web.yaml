# A3 — where environment variables come from, and who can see them.
#
# The same values reach the container three ways:
#   1. envFrom  -> every key of the ConfigMap becomes an env var
#   2. valueFrom-> one key, or the pod name / node name from the API
#   3. literal  -> written straight into the pod spec (wins over envFrom)
#
# The init container dumps its environment into the shared emptyDir, so the
# page proves what the container actually received.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    app.kubernetes.io/name: web
data:
  APP_ENV: "from-configmap"
  LOG_LEVEL: "debug"
  GREETING: "hello from the ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      # The init container runs first and fills the shared volume.
      initContainers:
        - name: render
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              env | sort > /www/env.txt
              {
                echo '<!doctype html><meta charset="utf-8">'
                echo '<title>k8s lab - A3</title>'
                echo '<body style="font-family:system-ui;margin:3rem;background:#0f172a;color:#e2e8f0">'
                echo '<h1>k8s lab - A3</h1>'
                echo "<p>APP_ENV = <code>${APP_ENV}</code></p>"
                echo "<p>LOG_LEVEL = <code>${LOG_LEVEL}</code></p>"
                echo "<p>GREETING = <code>${GREETING}</code></p>"
                echo "<p>POD_NAME = <code>${POD_NAME}</code></p>"
                echo "<p>COMPOSED = <code>${COMPOSED}</code></p>"
                echo '<p><a href="env.txt">full environment</a></p>'
              } > /www/index.html
          volumeMounts:
            - name: www
              mountPath: /www
          envFrom:
            # All keys at once. These lose to an explicit env entry below.
            - configMapRef:
                name: web-config
          env:
            # Explicit entries win over envFrom for the same key.
            - name: APP_ENV
              value: "from-pod-spec"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # $(VAR) is expanded from variables declared earlier in this list.
            - name: COMPOSED
              value: "$(APP_ENV)-$(LOG_LEVEL)"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          # nginx reads the files the init container produced.
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
