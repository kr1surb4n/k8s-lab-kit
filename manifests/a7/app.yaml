# A7 application layer: nginx + php-fpm in one pod, sharing one host folder.
#
# The code and the SQLite file come from /mnt/lab/app on the node, which is
# `minikube mount "$PWD:/mnt/lab"` on the host. Edit a file on the host, reload
# the page, see the change. No rebuild, no restart.
#
# Bites:
#   - both containers must mount the code at the same path
#   - php-fpm runs as uid 82 (www-data) on Alpine; the init container fixes
#     the two writable folders and keeps database.sqlite at 0666 for the host
#   - nginx is read-only: it only needs to find the files, PHP executes them
#   - opcache must not cache stale files (this image has it off by default)
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-conf
  labels:
    app.kubernetes.io/name: web
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # Laravel-shaped layout: the document root is public/.
      root /var/www/html/public;
      index index.php index.html;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        try_files $uri $uri/ /index.php?$query_string;
      }

      # Hand every .php request to the php-fpm container in this pod.
      location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  # One replica: SQLite on a shared volume allows a single writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      initContainers:
        # Wait for PostgreSQL before the app starts, then fix the mount.
        - name: prepare
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
              mkdir -p /var/www/html/database /var/www/html/storage
              touch /var/www/html/database/database.sqlite
              chown -R 82:82 /var/www/html/database /var/www/html/storage
              chmod 666 /var/www/html/database/database.sqlite
              # The shared dirs must be writable by both the app user (82) and
              # the host user, because SQLite creates its -wal/-shm files in the
              # directory and the host is allowed to write the database file.
              chmod 777 /var/www/html/database /var/www/html/storage
              echo "mount ready"
          volumeMounts:
            - name: app
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: php
          image: k8s-lab/php:8.3
          ports:
            - name: fpm
              containerPort: 9000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: lab
            - name: DB_USERNAME
              value: lab
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SQLITE_PATH
              value: /var/www/html/database/database.sqlite
          volumeMounts:
            - name: app
              mountPath: /var/www/html
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: app
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        # One host folder for code, storage and the SQLite file.
        - name: app
          hostPath:
            path: /mnt/lab/app
            type: Directory
        - name: nginx-conf
          configMap:
            name: web-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
