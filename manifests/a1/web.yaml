# A1 — nginx serving a host directory through a hostPath mount.
#
# The content is NOT in the image. The host folder `site/` is mounted into
# the minikube node by `minikube mount`, and the pod reads it from there.
# Change the files on the host, reload the page: no restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          # The host directory arrives read-only; nginx only needs to read it.
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        # Directory, not File: the folder must exist on the node, which is what
        # `minikube mount "$PWD:/mnt/lab"` provides.
        - name: site
          hostPath:
            path: /mnt/lab/site
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
