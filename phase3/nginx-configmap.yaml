apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static-content
  namespace: phase3
  labels:
    app: nginx-static
    phase: phase3
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kubernetes Lab - Phase 3</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
            .container { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
            h1 { color: #333; margin-bottom: 10px; }
            .subtitle { color: #666; margin-bottom: 30px; }
            .info { background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 20px 0; }
            .info h3 { margin-top: 0; color: #444; }
            .badge { display: inline-block; background: #667eea; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; margin: 4px; }
            .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #888; font-size: 14px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Kubernetes Lab - Phase 3</h1>
            <p class="subtitle">Single-node Kubernetes (minikube) with nginx serving static content</p>
            <div class="info">
                <h3>Deployment Status</h3>
                <p>This static page is served by <strong>nginx</strong> running on <strong>minikube</strong> (Kubernetes v1.37.0)</p>
            </div>
            <div class="info">
                <h3>What's Running</h3>
                <span class="badge">nginx Deployment</span>
                <span class="badge">Static HTML ConfigMap</span>
                <span class="badge">LoadBalancer Service</span>
                <span class="badge">minikube tunnel</span>
            </div>
            <div class="info">
                <h3>Phase 3 Milestones</h3>
                <ul>
                    <li>Minikube running (Kubernetes v1.37.0)</li>
                    <li>nginx serving static page</li>
                    <li>Service exposed via LoadBalancer</li>
                    <li>Magento + MySQL via Helm (next)</li>
                </ul>
            </div>
            <div class="footer">
                Kubernetes Lab Kit - github.com/kr1surb4n/k8s-lab-kit
            </div>
        </div>
    </body>
</html>