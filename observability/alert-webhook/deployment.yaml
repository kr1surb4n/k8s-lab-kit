apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  labels:
    app.kubernetes.io/name: alert-webhook
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-webhook
        app.kubernetes.io/part-of: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: webhook
          image: python:3.12-alpine
          command: ["python3", "/app/main.py"]
          env:
            - name: PORT
              value: "8080"
            # Do not try to write .pyc files on the read-only root filesystem.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: alert-webhook-script
        - name: tmp
          emptyDir: {}
