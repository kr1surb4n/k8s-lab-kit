# Deliberately unschedulable pod: proves PodNotReady reaches the webhook.
# Apply: kubectl apply -f observability/alert-webhook/fixtures/pending-pod.yaml
# Remove: kubectl delete -f observability/alert-webhook/fixtures/pending-pod.yaml
# The request is larger than the cluster, so the pod stays Pending.
apiVersion: v1
kind: Pod
metadata:
  name: webhook-pending
  namespace: k8s-lab
  labels:
    app.kubernetes.io/name: webhook-pending
    lab: webhook
spec:
  containers:
    - name: webhook-pending
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100"
          memory: "100Gi"
