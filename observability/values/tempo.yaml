# Tempo, single binary, local disk, one day of traces.
# Chart: grafana/tempo. Check `helm show values grafana/tempo` before upgrading;
# the keys below move between chart versions.
tempo:
  retention: 24h
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 400Mi}
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

persistence:
  enabled: true
  size: 5Gi

# Single binary is the only mode that fits here.
deploymentMode: SingleBinary
