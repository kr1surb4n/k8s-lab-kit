# Values for kube-prometheus-stack, trimmed for a 6 GiB cluster.
# The defaults assume a real cluster; these assume a laptop.
alertmanager:
  enabled: true
  # One receiver for the lab: an in-cluster webhook that records deliveries.
  # The test alert is in alerts/lab-rules.yaml; everything else stays on "null".
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["namespace"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname =~ "LabWebhookTest|PodNotReady"
          receiver: "lab-webhook"
    receivers:
      - name: "null"
      - name: "lab-webhook"
        webhook_configs:
          - url: "http://alert-webhook/alert"
            send_resolved: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 100Mi}

grafana:
  enabled: true
  # No password in Git. The chart generates one; read it from the Secret.
  persistence:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 300Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 700Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 8Gi
    # The lab's own ServiceMonitors do not carry the chart's release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 100Mi}
    limits: {memory: 250Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 80Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 160Mi}

prometheusOperator:
  additionalArgs:
    - --enable-probe-support=true
