# Loki, single binary, filesystem storage, three days.
# Chart: grafana/loki. The chart's defaults are distributed and too large.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 400Mi}

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# The distributed pieces are not used in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
