# OpenTelemetry collector: receive OTLP from the lab, export to Tempo.
# Chart: open-telemetry/opentelemetry-collector
mode: deployment
replicaCount: 1

# Disable the chart's automatic rewrite of deprecated component names
# (e.g. otlphttp -> otlp_http) which breaks compatibility with collector 0.163.2
rewriteDeprecatedComponentNames: false

# Use the official OpenTelemetry Collector contrib image (includes OTLP receiver/exporter)
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.163.2"
  pullPolicy: IfNotPresent

resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 250Mi}

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
    batch: {}
  exporters:
    # Use otlphttp for Tempo (supported in collector 0.163.2)
    otlphttp:
      endpoint: http://tempo.observability.svc.cluster.local:4318
      tls:
        insecure: true
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp]
