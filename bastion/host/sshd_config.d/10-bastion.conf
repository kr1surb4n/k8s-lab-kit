# Hardened sshd for the bastion host.
# Install as /etc/ssh/sshd_config.d/10-bastion.conf and run: sshd -t
#
# Keep a second session open while applying this; a typo can lock you out.

# No root, no passwords.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes

# One door, one user (setup.sh writes the same name).
AllowUsers labjump
MaxAuthTries 3
LoginGraceTime 20

# Local forwards only: the laptop reaches the lab through the bastion.
# Remote forwards would turn the bastion into a way *into* the laptop.
AllowAgentForwarding no
AllowTcpForwarding local
X11Forwarding no
PermitTunnel no
GatewayPorts no

# Idle sessions should die; a forgotten terminal is an open door.
ClientAliveInterval 300
ClientAliveCountMax 2

# Log more, not less.
LogLevel VERBOSE
