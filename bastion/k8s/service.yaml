apiVersion: v1
kind: Service
metadata:
  name: bastion
  namespace: bastion
  labels:
    app.kubernetes.io/name: bastion
spec:
  selector:
    app.kubernetes.io/name: bastion
  ports:
    - name: ssh
      port: 22
      targetPort: 22
  type: ClusterIP
---
# Optional: only useful on k3d/k3s or a cloud node, where the node IP is
# reachable. On minikube's docker driver this stays inside the node.
apiVersion: v1
kind: Service
metadata:
  name: bastion-nodeport
  namespace: bastion
  labels:
    app.kubernetes.io/name: bastion
spec:
  selector:
    app.kubernetes.io/name: bastion
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30222
  type: NodePort
