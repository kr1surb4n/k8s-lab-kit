# Copy to bastion-authorized-keys.yaml, put a real public key in it, apply.
# The key below is a placeholder and will not authenticate anyone.
apiVersion: v1
kind: Secret
metadata:
  name: bastion-authorized-keys
  namespace: bastion
type: Opaque
stringData:
  authorized_keys: |
    # replace this line with your own public key
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceThisWithYourOwnPublicKeyReplaceMe labjump@laptop
